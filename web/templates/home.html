{{define "content"}}
<div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-8 sm:gap-12 my-auto">
    
    <!-- Карточка 1: История -->
    <a href="/subjects/history" class="gold-border-card bg-white rounded-2xl p-8 sm:p-12 cursor-pointer flex flex-col justify-between text-center relative overflow-hidden group min-h-[260px] sm:min-h-[280px] no-underline">
        <div class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=800&auto=format&fit=crop')] bg-cover bg-center pointer-events-none group-hover:opacity-15 transition-opacity"></div>
        
        <div class="relative z-10 my-auto">
            <h2 class="text-3xl sm:text-4xl font-bold text-burgundy-900 mb-4 group-hover:text-gold-600 transition-colors">
                История
            </h2>
            <p class="text-gray-700 text-lg sm:text-xl leading-relaxed">
                Увлекательные конспекты, интерактивные исторические карты, глубокие разборы эпох и видеоуроки
            </p>
        </div>
    </a>

    <!-- Карточка 2: Обществознание -->
    <a href="/subjects/social" class="gold-border-card bg-white rounded-2xl p-8 sm:p-12 cursor-pointer flex flex-col justify-between text-center relative overflow-hidden group min-h-[260px] sm:min-h-[280px] no-underline">
        <div class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=800&auto=format&fit=crop')] bg-cover bg-center pointer-events-none group-hover:opacity-15 transition-opacity"></div>
        
        <div class="relative z-10 my-auto">
            <h2 class="text-3xl sm:text-4xl font-bold text-burgundy-900 mb-4 group-hover:text-gold-600 transition-colors">
                Обществознание
            </h2>
            <p class="text-gray-700 text-lg sm:text-xl leading-relaxed">
                Человек и общество, экономика, политика, право и социальные отношения
            </p>
        </div>
    </a>

</div>
{{end}}
