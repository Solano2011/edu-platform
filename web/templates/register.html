{{define "content"}}
<div class="w-full max-w-md mx-auto my-auto flex flex-col">
    <div class="gold-border-card bg-white rounded-2xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
        <div class="absolute inset-0 opacity-5 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=800&auto=format&fit=crop')] bg-cover bg-center pointer-events-none"></div>

        <div class="relative z-10">
            <h1 class="text-3xl font-bold text-burgundy-900 mb-2 text-center">
                Регистрация ученика
            </h1>
            <p class="text-gray-600 text-sm mb-6 text-center">
                Регистрация доступна только по персональному приглашению репетитора
            </p>

            {{if .Error}}
            <div class="bg-red-100 border border-red-300 text-red-800 p-3 rounded-xl mb-6 text-sm text-center">
                {{.Error}}
            </div>
            {{end}}

            <form action="/register" method="POST" autocomplete="off" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Код приглашения:</label>
                    <input 
                        type="text" 
                        name="code" 
                        value="{{.Code}}"
                        required 
                        placeholder="Вставьте код приглашения" 
                        class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base font-mono bg-gray-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Электронная почта:</label>
                    <input 
                        type="email" 
                        name="email" 
                        required 
                        maxlength="254"
                        placeholder="student@example.com" 
                        class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Пароль (от 8 до 72 символов):</label>
                    <input 
                        type="password" 
                        name="password" 
                        required 
                        minlength="8"
                        maxlength="72"
                        placeholder="••••••••" 
                        class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Повторите пароль:</label>
                    <input 
                        type="password" 
                        name="confirm_password" 
                        required 
                        minlength="8"
                        maxlength="72"
                        placeholder="••••••••" 
                        class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">
                </div>

                <button type="submit" class="w-full mt-2 py-3 rounded-xl bg-burgundy-900 text-gold-300 border border-gold-500 font-bold hover:bg-gold-500 hover:text-burgundy-900 transition-all duration-300 shadow-md text-base">
                    Завершить регистрацию
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600 border-t border-gray-200 pt-4">
                Уже зарегистрированы? 
                <a href="/login" class="text-burgundy-900 font-bold hover:text-gold-600 transition-colors underline ml-1">
                    Войти в кабинет
                </a>
            </div>
        </div>
    </div>
</div>
{{end}}
