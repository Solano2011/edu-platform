{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    
    <!-- Google Fonts: Old Standard TT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Old Standard TT"', 'serif'],
                        sans: ['"Old Standard TT"', 'serif']
                    },
                    colors: {
                        burgundy: {
                            800: '#58111A',
                            900: '#3B0A0F',
                            950: '#2A060A',
                        },
                        gold: {
                            300: '#F3E5AB',
                            400: '#E6CA65',
                            500: '#D4AF37',
                            600: '#AA820A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Old Standard TT', serif;
        }
        .gold-border-card {
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .gold-border-card:hover {
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 15px 30px -5px rgba(212, 175, 55, 0.2), 0 10px 15px -5px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="bg-burgundy-950 text-gray-900 min-h-screen flex flex-col font-serif selection:bg-gold-500 selection:text-burgundy-950">

    <!-- Фоновая текстура карты -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1920&auto=format&fit=crop')] bg-cover bg-center"></div>

    <!-- Шапка (Навбар) -->
    <header class="w-full bg-burgundy-900/95 border-b border-gold-500/40 px-6 sm:px-12 py-4 flex items-center justify-between shadow-xl backdrop-blur-sm sticky top-0 z-40">
        <div class="flex items-center space-x-4 sm:space-x-6">
            <a href="/" class="text-gold-400 font-bold text-xl sm:text-2xl tracking-wide hover:text-gold-300 transition-colors">
                EduPlatform
            </a>
            <span class="hidden sm:inline-block text-gold-300/80 text-sm sm:text-base border-l border-gold-500/40 pl-4 sm:pl-6">
                Обучающая платформа
            </span>
        </div>

        <div class="flex items-center space-x-4">
            {{if .IsAdmin}}
            <a href="/admin/lessons/new" class="text-xs sm:text-sm text-gold-300/80 hover:text-gold-300 transition-colors hidden md:inline-block">
                + Добавить урок
            </a>
            <a href="/admin/invites" class="text-xs sm:text-sm text-gold-300/80 hover:text-gold-300 transition-colors hidden md:inline-block">
                Инвайты учеников
            </a>
            {{end}}

            {{if .IsAuthenticated}}
            <form action="/logout" method="POST" class="inline m-0">
                <button type="submit" class="px-5 py-2 rounded-xl text-gold-300 border border-gold-500 bg-burgundy-800 hover:bg-gold-500 hover:text-burgundy-900 transition-all duration-300 shadow-sm text-sm sm:text-base font-semibold cursor-pointer">
                    Выйти
                </button>
            </form>
            {{else}}
            <a href="/login" class="px-5 py-2 rounded-xl text-gold-300 border border-gold-500 bg-burgundy-800 hover:bg-gold-500 hover:text-burgundy-900 transition-all duration-300 shadow-sm text-sm sm:text-base font-semibold no-underline">
                Войти в кабинет
            </a>
            {{end}}
        </div>
    </header>

    <!-- Основной контент страницы -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 sm:p-12 relative z-10 w-full">
        {{template "content" .}}
    </main>

    <!-- Подвал сайта -->
    <footer class="w-full bg-burgundy-950/90 border-t border-gold-500/20 py-6 text-center text-xs sm:text-sm text-gold-300/60 relative z-10">
        <p>© 2026 EduPlatform. Все права защищены.</p>
    </footer>

</body>
</html>
{{end}}
