{{define "content"}}
<div class="w-full max-w-2xl flex flex-col">
    <div class="mb-4">
        <a href="/lessons/{{.Lesson.Slug}}" class="inline-flex items-center text-gold-300 hover:text-gold-400 transition-colors text-base mb-2">
            ← Отмена и возврат к уроку
        </a>
    </div>

    <div class="gold-border-card bg-white rounded-2xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
        <div class="absolute inset-0 opacity-5 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=800&auto=format&fit=crop')] bg-cover bg-center pointer-events-none"></div>

        <div class="relative z-10">
            <h1 class="text-2xl sm:text-3xl font-bold text-burgundy-900 mb-6">
                Редактирование урока
            </h1>

            {{if .Error}}
            <div class="bg-red-100 border border-red-300 text-red-800 p-4 rounded-xl mb-6 text-sm">
                {{.Error}}
            </div>
            {{end}}

            <form action="/admin/lessons/{{.Lesson.Slug}}/edit" method="POST" enctype="multipart/form-data" class="flex flex-col gap-5">
                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Направление (предмет):</label>
                    <select name="subject" required class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none bg-white text-gray-900 text-base">
                        <option value="history" {{if eq .Lesson.Subject "history"}}selected{{end}}>История</option>
                        <option value="social" {{if eq .Lesson.Subject "social"}}selected{{end}}>Обществознание</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Тип контента:</label>
                    <select name="content_type" required class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none bg-white text-gray-900 text-base">
                        <option value="mixed" {{if eq .Lesson.ContentType "mixed"}}selected{{end}}>▶ Видео + Конспект (Mixed)</option>
                        <option value="article" {{if eq .Lesson.ContentType "article"}}selected{{end}}>📄 Статья (Article)</option>
                        <option value="video" {{if eq .Lesson.ContentType "video"}}selected{{end}}>▶ Видеоурок (Video)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Заголовок урока:</label>
                    <input type="text" name="title" value="{{.Lesson.Title}}" required class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Краткое описание (для карточки):</label>
                    <textarea name="summary" rows="3" required class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">{{.Lesson.Summary}}</textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Иллюстрация / Карта:</label>
                    {{if .Lesson.ImageURL}}
                    <div class="mb-2 flex items-center gap-3">
                        <img src="{{.Lesson.ImageURL}}" alt="Текущая картинка" class="h-16 w-24 object-cover rounded border border-gray-300">
                        <span class="text-xs text-gray-500">Текущий файл загружен. Выберите новый, только если хотите заменить его.</span>
                    </div>
                    {{end}}
                    <input type="file" name="lesson_image" accept="image/*" class="w-full p-2 rounded-xl border border-gray-300 focus:border-gold-500 outline-none text-sm bg-gray-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Ссылка на видео (YouTube Embed URL):</label>
                    <input type="text" name="video_url" value="{{.Lesson.VideoURL}}" placeholder="https://www.youtube.com/embed/..." class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Время чтения (в минутах):</label>
                    <input type="number" name="reading_time" value="{{.Lesson.ReadingTime}}" min="1" required class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-burgundy-900 mb-1">Полный текст конспекта (поддерживает HTML):</label>
                    <textarea name="body" rows="9" required class="w-full p-3 rounded-xl border border-gray-300 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none text-base font-mono">{{.Lesson.Body}}</textarea>
                </div>

                <button type="submit" class="w-full mt-2 py-3.5 rounded-xl bg-burgundy-900 text-gold-300 border border-gold-500 font-bold hover:bg-gold-500 hover:text-burgundy-900 transition-all duration-300 shadow-md text-base">
                    Сохранить изменения
                </button>
            </form>
        </div>
    </div>
</div>
{{end}}
